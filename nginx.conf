# nginx.conf – Seva Setu reverse proxy
# Render terminates TLS and forwards plain HTTP to this container on $PORT (default 10000).
# We route each path prefix to the correct internal back-end service.
#
# Internal service names (Render private network):
#   portal        → Flask app on port 8000
#   citizen-mcp   → FastMCP citizen server on port 8001
#   officer-mcp   → FastMCP officer server on port 8002

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Increase buffer sizes for SSE / streamable-HTTP responses
    proxy_buffering           off;
    proxy_read_timeout        120s;
    proxy_send_timeout        120s;
    proxy_connect_timeout     10s;

    # ---- Back-end upstreams ---------------------------------------------------
    upstream portal_up {
        server portal:8000;
    }
    upstream citizen_up {
        server citizen-mcp:8001;
    }
    upstream officer_up {
        server officer-mcp:8002;
    }

    server {
        # Render sets $PORT at runtime; default is 10000.
        listen 10000;

        # -------------------------------------------------------------------
        # Citizen MCP  →  /mcp/citizen/…
        # FastMCP expects requests at /mcp, so we strip the prefix.
        # -------------------------------------------------------------------
        location /mcp/citizen {
            rewrite ^/mcp/citizen(/.*)? /mcp$1 break;
            proxy_pass http://citizen_up;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Required for SSE / streaming
            proxy_set_header Connection        "";
        }

        # -------------------------------------------------------------------
        # Officer MCP  →  /mcp/officer/…
        # -------------------------------------------------------------------
        location /mcp/officer {
            rewrite ^/mcp/officer(/.*)? /mcp$1 break;
            proxy_pass http://officer_up;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
        }

        # -------------------------------------------------------------------
        # Everything else  →  Flask portal (handles /eval-dashboard, /mcp/*, /admin, etc.)
        # -------------------------------------------------------------------
        location / {
            proxy_pass http://portal_up;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";
        }

        # Health-check endpoint (useful for uptime monitoring)
        location = /healthz {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }
    }
}

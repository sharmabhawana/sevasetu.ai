# Sewa Setu Production Nginx Configuration
# Reverse proxy routing for Web Portal, Evaluation Dashboard, and Streamable HTTP MCP Servers.

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;

    upstream app_backend {
        server app:8000;
        keepalive 32;
    }

    upstream citizen_mcp_backend {
        server mcp-citizen:8001;
        keepalive 32;
    }

    upstream officer_mcp_backend {
        server mcp-officer:8002;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # -------------------------------------------------------------------
        # Citizen FastMCP Streamable HTTP Endpoint
        # -------------------------------------------------------------------
        location /mcp/citizen {
            proxy_pass http://citizen_mcp_backend/mcp;
            proxy_http_version 1.1;

            # Streamable HTTP / Server-Sent Events (SSE) requirements
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # -------------------------------------------------------------------
        # Block Officer FastMCP Streamable HTTP Endpoint
        # -------------------------------------------------------------------
        location /mcp/officer {
            proxy_pass http://officer_mcp_backend/mcp;
            proxy_http_version 1.1;

            # Streamable HTTP / Server-Sent Events (SSE) requirements
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # -------------------------------------------------------------------
        # Seva Setu Flask Web Portal & Evaluation Dashboard (/eval-dashboard)
        # -------------------------------------------------------------------
        location / {
            proxy_pass http://app_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 90s;
            proxy_connect_timeout 90s;
        }
    }
}
